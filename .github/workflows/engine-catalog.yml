name: Publish gen1recomp engines

# Upstream ships several times a day, so this is a stream rather than an
# occasional event. Hourly, and the NO-OP PATH IS THE COMMON ONE: roughly 720
# runs a month, most of which find nothing. It asks the releases API and
# compares against what the catalog already holds before cloning or building
# anything.
#
# IT CATCHES UP, it does not only take the newest. An earlier version of this
# asked `releases/latest` and published that one release. At several releases a
# day against an hourly poll, any release superseded inside the hour was
# skipped forever: v0.2.28 already existed, unpublished, while v0.2.29 was
# latest. So it publishes EVERY release the catalog is missing, oldest first,
# because ordinals are assigned `max + 1` and release order is exactly what
# they have to mean.
#
# What it publishes is a PREVIEW. A workflow that has not run a line of Lua
# cannot know an engine works, and `shippedIn` stays null until a human cuts a
# Phosphor release with that engine in it.
#
# THESE ARE GEN1RECOMP'S ENGINES. Every artifact is upstream's source
# (github.com/bryanthaboi/gen1recomp, by BOIS CLUB GAMES) with Phosphor's
# overlay applied. Phosphor packages and publishes them; it did not write them.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Publish only this ref, instead of catching up'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: engine-catalog
  cancel-in-progress: false

env:
  ENGINE_ID: gen1recomp
  UPSTREAM_REPO: bryanthaboi/gen1recomp
  # A bound on how many releases one run will build, so a first run against a
  # long backlog cannot sit for an hour. Whatever is left is named in the log
  # and picked up by the next run: a cap that hides what it dropped reads as
  # "everything is published" when it is not.
  MAX_PER_RUN: 5

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The overlay is MIRRORED from the Phosphor app repo, which has no git
      # remote, so this repo cannot check it out. OVERLAY_STAMP is the gate: it
      # hashes every overlay file, path included, and a mirror hand-edited here
      # fails loudly instead of publishing an engine built from files nobody
      # reviewed. Sandbox.lua's deny lists are a blacklist, so a wrong copy is
      # a sandbox with an entry missing.
      - name: Verify the overlay mirror
        id: overlay
        run: |
          set -euo pipefail
          stamp=$(cd engine/overlay && find . -type f ! -name '*.proposed' -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          recorded=$(tr -d '[:space:]' < engine/OVERLAY_STAMP)
          if [ "$stamp" != "$recorded" ]; then
            echo "::error::engine/overlay does not match engine/OVERLAY_STAMP."
            echo "::error::computed $stamp, recorded $recorded."
            echo "::error::Re-run Scripts/sync_overlay_mirror.sh in the app repo."
            exit 1
          fi
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      # The cheap question, asked before anything is cloned. Keyed on the
      # upstream COMMIT, not the payload id: zip is not byte-identical between
      # runs, so repacking one commit yields a fresh hash and a fresh id, and
      # keying on that would republish the same release every hour.
      - name: Which releases is the catalog missing
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.upstream_ref }}"
          if [ -n "$ref" ]; then
            printf '%s\n' "$ref" > tags.txt
          else
            # Oldest first. `--paginate` so a long history is not truncated,
            # and drafts and prereleases are dropped: upstream marking a
            # release as a prerelease is upstream saying not yet.
            gh api "repos/$UPSTREAM_REPO/releases" --paginate \
              --jq '.[] | select(.draft == false and .prerelease == false)
                    | [.published_at, .tag_name] | @tsv' \
              | sort | cut -f2 > tags.txt
          fi

          # Resolve every tag to a commit, oldest first, then take only what
          # comes AFTER the newest release the catalog already has.
          #
          # NOT "every release the catalog is missing". The catalog holds three
          # seeded entries and upstream has years of tags, so that reading made
          # every release since 0.2.1 pending and the run would have ground
          # backwards through history publishing ancient engines as "previews".
          # Catching up means the releases since the last one we published, and
          # nothing older.
          : > resolved.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            sha=$(gh api "repos/$UPSTREAM_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)
            if [ -n "$sha" ]; then
              type=$(gh api "repos/$UPSTREAM_REPO/git/ref/tags/$tag" --jq '.object.type')
              # An annotated tag points at a tag object, not the commit.
              [ "$type" = "tag" ] && sha=$(gh api "repos/$UPSTREAM_REPO/git/tags/$sha" --jq '.object.sha')
            fi
            [ -n "$sha" ] && printf '%s\t%s\n' "$tag" "$sha" >> resolved.txt
          done < tags.txt

          node -e '
            const fs = require("fs");
            let catalog = { entries: [] };
            try { catalog = JSON.parse(fs.readFileSync("public/v1/engines.json", "utf8")); }
            catch (e) { if (e.code !== "ENOENT") throw e; }
            const engine = process.env.ENGINE_ID;
            const known = new Set((catalog.entries || [])
              .filter((x) => x.engineID === engine).map((x) => x.upstream));
            const rows = fs.readFileSync("resolved.txt", "utf8").trim().split("\n")
              .filter(Boolean).map((l) => l.split("\t"));
            // The LAST already-published release in release order. Everything
            // after it is what this run owes; everything before it is history
            // that was deliberately never published.
            let lastKnown = -1;
            rows.forEach(([, sha], i) => { if (known.has(sha)) lastKnown = i; });
            // A catalog with none of these at all is a catalog that has never
            // published this engine. Take the newest release only: backfilling
            // a whole history as "previews" is not what anybody asked for.
            let pending = lastKnown === -1 ? rows.slice(-1) : rows.slice(lastKnown + 1);
            // ONE COMMIT CAN CARRY SEVERAL TAGS, and upstream does it: v0.2.30
            // and v0.2.31 are the same commit, the same code, released twice
            // under two names. Building both published one release twice, at
            // two ordinals, with two payload ids that differ only because zip
            // is not deterministic -- two rows on the player page for one
            // engine. (No apostrophes in this block: it lives inside a
            // single-quoted node -e, and one ended the script mid-line and
            // handed the rest to bash. Both Aug 27 runs died exactly there.)
            // Keep the LAST tag on a commit, which is the name
            // upstream settled on.
            const byCommit = new Map();
            pending.forEach((row) => byCommit.set(row[1], row));
            pending = [...byCommit.values()];
            fs.writeFileSync("pending.txt",
              pending.map((r) => r.join("\t")).join("\n") + (pending.length ? "\n" : ""));
            process.stderr.write(
              `${rows.length} releases upstream, newest already published at index ` +
              `${lastKnown}, ${pending.length} to build\n`);
          '

          total=$(wc -l < pending.txt | tr -d ' ')
          echo "Catalog is missing $total release(s) newer than what it holds."
          # NOT capped here. MAX_PER_RUN applies to what gets BUILT, and which
          # of these can be built is the next step's question -- see its header
          # for why capping the pending list instead can wedge the stream.
          echo "count=$total" >> "$GITHUB_OUTPUT"

      - name: Clone gen1recomp
        if: steps.poll.outputs.count != '0'
        run: |
          set -euo pipefail
          git clone --quiet "https://github.com/$UPSTREAM_REPO.git" work/LoveCore/.gen1recomp-pin
          mkdir -p work/Scripts work/LoveCore
          cp engine/port_overlay.sh work/Scripts/port_overlay.sh
          chmod +x work/Scripts/port_overlay.sh
          cp engine/GEN1RECOMP_SHA work/LoveCore/GEN1RECOMP_SHA
          # port_overlay.sh refuses any commit whose LICENSE.MD is not listed
          # here by sha256. gen1recomp relicensed at v0.2.62 from MIT to GPLv3
          # with Section 7 additional terms, and BOIS CLUB GAMES cleared that
          # text for Phosphor on Sep 22 2026; without this file the checker
          # answers PORT_VERDICT=licence for every release from v0.2.62 on and
          # this workflow publishes nothing, which is what it did.
          cp engine/GEN1RECOMP_LICENCE_CLEARED work/LoveCore/GEN1RECOMP_LICENCE_CLEARED
          cp -R engine/overlay work/LoveCore/gen1recomp-overlay
          chmod +x engine/build_payload.sh

      # WHICH OF THOSE THIS OVERLAY CAN BUILD -- asked before anything is
      # capped, cloned into a payload, or published.
      #
      # TWO DIFFERENT FAILURES WEAR THE SAME VERDICT. `port_overlay.sh
      # --check` answers `drifted` for any release the overlay does not merge
      # onto cleanly, and until now every one of those stopped the run and
      # opened a drift issue. But the overlay is ported against exactly ONE
      # upstream commit -- engine/GEN1RECOMP_SHA, written by the app repo's
      # Scripts/sync_overlay_mirror.sh -- and that splits `drifted` in two:
      #
      #   * A release AFTER that commit that will not port is real drift.
      #     Upstream has moved past the overlay, somebody has to re-port it,
      #     and the run must stop rather than skip ahead: ordinals are
      #     `max + 1` and have to follow release order. Unchanged below.
      #   * A release BEFORE it is not drift at all. The overlay already knows
      #     everything up to its base, so an older release failing means only
      #     that the overlay was never written for it. At the 0.3.2 port that
      #     is concrete: overlay/main.lua requires `src.import.LauncherWindow`,
      #     and upstream has no file by that name before v0.3.0. Publishing it
      #     anyway would put a preview on the download page that dies on its
      #     first require. So it is skipped BY NAME, and never published.
      #
      # Skipping only ever moves forward, so release order is preserved among
      # the entries that do get published.
      #
      # WHY THIS RUNS BEFORE MAX_PER_RUN. The cap takes the OLDEST pending
      # releases. With nine unbuildable releases sitting in front of two good
      # ones, a capped run took five unbuildable ones, published nothing, and
      # the next hourly run recomputed the same nine and took the same five --
      # forever, with `catalogedAgainst` frozen and a drift issue recommented
      # on the hour. The cap has to apply to what will be BUILT, which is what
      # its own comment always said it was.
      - name: Select what this overlay can publish
        if: steps.poll.outputs.count != '0'
        id: select
        run: |
          set -euo pipefail
          base=$(tr -d '[:space:]' < engine/GEN1RECOMP_SHA)
          # Fail loudly rather than treat every release as drift: if the base
          # is not upstream history, the mirror is wrong and no verdict below
          # would mean anything.
          git -C work/LoveCore/.gen1recomp-pin cat-file -e "$base^{commit}" 2>/dev/null \
            || { echo "::error::engine/GEN1RECOMP_SHA ($base) is not a commit in $UPSTREAM_REPO."; exit 1; }

          : > publishable.txt
          : > skipped.txt
          while IFS=$'\t' read -r tag sha; do
            [ -n "$tag" ] || continue
            set +e
            bash work/Scripts/port_overlay.sh --check "$sha" > port.txt 2>&1
            set -e
            verdict=$(grep '^PORT_VERDICT=' port.txt | cut -d= -f2 || echo drifted)

            if [ "$verdict" = "clean" ]; then
              printf '%s\t%s\n' "$tag" "$sha" >> publishable.txt
              continue
            fi

            # Older than the base the overlay was ported against? Then this is
            # out of scope, not drift. `$sha != $base` matters: an overlay that
            # will not port onto its OWN base is a real problem, and falls
            # through to the drift path below where it belongs.
            if [ "$sha" != "$base" ] && \
               git -C work/LoveCore/.gen1recomp-pin merge-base --is-ancestor "$sha" "$base" 2>/dev/null; then
              printf '%s\t%s\n' "$tag" "$sha" >> skipped.txt
              echo "::notice::$tag predates ${base:0:10}, the commit this overlay is ported against. Skipped: the overlay was never written for it, and building it would publish a preview that cannot run."
              continue
            fi

            files=$(grep '^PORT_CONFLICT_FILES=' port.txt | cut -d= -f2- || true)
            echo "DRIFTED=$tag" >> "$GITHUB_OUTPUT"
            echo "DRIFT_FILES=${files:-unknown}" >> "$GITHUB_OUTPUT"
            echo "::warning::$tag does not port cleanly. Stopping here so ordinals stay in release order."
            break
          done < pending.txt

          buildable=$(wc -l < publishable.txt | tr -d ' ')
          if [ "$buildable" -gt "$MAX_PER_RUN" ]; then
            echo "::notice::Building the oldest $MAX_PER_RUN of $buildable this run. Deferred to the next run:"
            tail -n +"$((MAX_PER_RUN + 1))" publishable.txt | cut -f1 | sed 's/^/::notice::  /'
            head -n "$MAX_PER_RUN" publishable.txt > publishable.trimmed
            mv publishable.trimmed publishable.txt
          fi
          echo "count=$(wc -l < publishable.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          {
            echo "### gen1recomp catch-up"
            echo "Overlay ported against \`$base\`."
            echo "- to build: $(wc -l < publishable.txt | tr -d ' ') -- $(cut -f1 publishable.txt | tr '\n' ' ')"
            echo "- skipped as out of scope: $(wc -l < skipped.txt | tr -d ' ') -- $(cut -f1 skipped.txt | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      # AFTER the selection, deliberately. The no-op path is the common one at
      # hourly, and everything above needs only `node`, `git` and `gh`, all
      # already on the runner. Installing first spent a dependency install on
      # ~720 runs a month that find nothing -- and now also on the runs that
      # find only releases this overlay cannot build.
      - name: Install dependencies
        if: steps.select.outputs.count != '0'
        run: npm ci

      # One loop, oldest first, because ordinals are `max + 1` and must follow
      # release order. Every row here already came back `clean` from the step
      # above, which is the single place that verdict is read.
      - name: Build and publish each selected release
        if: steps.select.outputs.count != '0'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published=0
          while IFS=$'\t' read -r tag sha; do
            version="${tag#v}"
            echo "::group::$tag ($sha)"

            rm -rf src out && mkdir -p src out
            git -C work/LoveCore/.gen1recomp-pin archive "$sha" | tar -x -C src
            bash engine/build_payload.sh "$PWD/src" "$PWD/engine/overlay" "$version" \
              "$PWD/out/payload.love" | tee build.txt
            bsha=$(grep '^BUILD_SHA256=' build.txt | cut -d= -f2)
            bytes=$(grep '^BUILD_BYTES=' build.txt | cut -d= -f2)
            games=$(grep '^BUILD_GAMES=' build.txt | cut -d= -f2-)
            id="$ENGINE_ID-${bsha:0:12}"
            mv out/payload.love "out/$id.love"
            date=$(git -C work/LoveCore/.gen1recomp-pin show -s --format=%cI "$sha")

            # The tag names the ENGINE and its own release number, never a
            # Phosphor version. Assets are release assets rather than files in
            # this repo: Pages content is committed, and several payloads a day
            # at 3 to 9 MB each would grow the repository without bound.
            rtag="$ENGINE_ID-$version"
            if ! gh release view "$rtag" >/dev/null 2>&1; then
              gh release create "$rtag" --title "$ENGINE_ID $version" --notes \
          "gen1recomp $version (upstream \`$sha\`), packaged for Phosphor with its host overlay.

          gen1recomp is by BOIS CLUB GAMES: https://github.com/$UPSTREAM_REPO
          Phosphor packages and publishes this build. It is not an official build of gen1recomp and is not endorsed by its authors."
            fi
            gh release upload "$rtag" "out/$id.love" --clobber

            node scripts/publish-engine.mjs \
              --engine "$ENGINE_ID" --engine-version "$version" --upstream "$sha" \
              --snapshot-date "$date" --sha256 "$bsha" --bytes "$bytes" \
              --url "${{ github.server_url }}/${{ github.repository }}/releases/download/$rtag/$id.love" \
              --games "$games" --overlay-stamp "${{ steps.overlay.outputs.stamp }}"
            published=$((published + 1))
            echo "::endgroup::"
          done < publishable.txt
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [ "$published" -gt 0 ]; then
            # The mod manifest derives its compatibility version from engines.json.
            # Commit both together or the Pages consistency check blocks deployment.
            node scripts/build-manifest.mjs
            npm test
          fi

      # ONE OPEN ISSUE PER DRIFTED FILE SET, updated, rather than one per
      # release. At several releases a day a naive workflow would file an issue
      # an hour; the signal is "the overlay is behind", not the 47th
      # notification. The title carries the file set, so a NEW set of files
      # drifting does open a new issue, which is the case that needs a look.
      - name: Surface the drift
        if: steps.select.outputs.DRIFTED != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files="${{ steps.select.outputs.DRIFT_FILES }}"
          title="Overlay is behind upstream: ${files:-unknown files}"
          body=$(cat <<EOF
          \`${{ steps.select.outputs.DRIFTED }}\` does not port cleanly, so it and
          everything after it were not published. Ordinals must follow release
          order, so the run stops at the first release it cannot build rather
          than skipping ahead.

          Conflicting files: \`${files:-unknown}\`

          Re-port in the app repo, which is where the overlay actually lives:

          \`\`\`
          bash Scripts/port_overlay.sh <sha>
          bash Scripts/sync_overlay_mirror.sh
          \`\`\`

          \`src/mods/Sandbox.lua\` is never auto-merged. Its deny lists are a
          blacklist, so a merge that silently drops an entry is a sandbox escape
          no test would catch.

          Updated, not duplicated, while the same files are drifted. Latest run:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          existing=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still drifted as of \`${{ steps.select.outputs.DRIFTED }}\`."
          else
            gh issue create --title "$title" --body "$body" --label overlay-drift \
              || gh issue create --title "$title" --body "$body"
          fi

      # Pushing to main is what deploys Pages, so this is also what makes the
      # new engines reachable by a phone.
      - name: Commit the catalog
        if: steps.publish.outputs.published != '' && steps.publish.outputs.published != '0'
        run: |
          set -euo pipefail
          if git diff --quiet -- public/v1/engines.json; then
            echo "catalog unchanged"
            exit 0
          fi
          git config user.name "phosphor-engine-bot"
          git config user.email "noreply@phosphoremulator.com"
          git add public/v1/engines.json public/v1/manifest.json
          # Any release skipped as out of scope is named in the commit body.
          # A run log ages out; this is the only durable record of why the
          # catalog's versions jump, and a gap nobody wrote down reads later
          # as a bug in the publisher.
          # Written to a file rather than built as a shell string: the body is
          # multi-line, and a multi-line string inside this block scalar
          # de-indents below `run: |` and stops the YAML parsing.
          printf '%s\n' \
            "feat(engines): publish ${{ steps.publish.outputs.published }} gen1recomp release(s) as previews" \
            > commit-msg.txt
          if [ -s skipped.txt ]; then
            printf '\n%s\n%s\n%s\n' \
              "Skipped as out of scope, not published: $(cut -f1 skipped.txt | tr '\n' ' ')" \
              "These predate the commit the overlay is ported against, so the" \
              "overlay was never written for them. See the Select step." \
              >> commit-msg.txt
          fi
          git commit -F commit-msg.txt
          git push
