name: Deploy Phosphor Emulator to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  # The engine catalog workflow commits public/v1/engines.json with
  # GITHUB_TOKEN, and a push made with that token deliberately does NOT
  # trigger other workflows -- GitHub's loop prevention. So the catalog was
  # committed and then never deployed: phosphoremulator.com kept serving the
  # previous file, and the whole hourly pipeline ended one step short of the
  # URL the app actually reads. Caught by publishing two real engines and
  # then curling the URL, which still showed three entries.
  #
  # `workflow_run` is the escape hatch for exactly this: it fires on another
  # workflow completing, whoever pushed.
  workflow_run:
    workflows: ["Publish gen1recomp engines"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A failed or drifted engine run has nothing new to serve.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test catalog policy
        run: npm test
      - name: Build static site
        env:
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
