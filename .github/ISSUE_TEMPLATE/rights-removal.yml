name: Rights or removal request
description: Ask us to hide or correct a listing that affects your rights.
title: "[Rights review] "
labels: ["rights-review", "urgent"]
body:
  - type: markdown
    attributes:
      value: Affected listings should be hidden while credible rights concerns are reviewed.
  - type: input
    id: listing
    attributes:
      label: Listing or file URL
    validations:
      required: true
  - type: textarea
    id: relationship
    attributes:
      label: Your relationship to the project or work
      description: Do not include private identity documents in a public issue.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Requested action and supporting context
    validations:
      required: true
